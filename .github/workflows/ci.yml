name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint syntax
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Verify Firebase deploy config
        run: npm run check:deploy
